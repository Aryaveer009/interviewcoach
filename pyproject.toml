[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewcoach"
version = "0.1.0"
description = "Mock-interview agent that tailors questions to your resume and a job description, scores answers against a rubric, and tracks your progress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryaveer Mankotia", email = "aryaveer.mankotia09@gmail.com" }]
keywords = ["interview-prep", "llm", "ai-agents", "streamlit", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Education",
]
dependencies = [
  "pydantic>=2.5,<3",
  "streamlit>=1.40",
  "openai>=1.40",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "reportlab>=4.0",
  "pandas-stubs",
]
screenshots = ["playwright>=1.45"]

[project.scripts]
interviewcoach = "interviewcoach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interviewcoach = ["sample_data/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/interviewcoach"]
