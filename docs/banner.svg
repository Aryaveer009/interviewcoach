<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">InterviewCoach</title>
  <desc id="d">Mock interviews tailored to your resume and the job, scored against a rubric.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.10" fill="none" stroke="#fff" stroke-width="1">
    <circle cx="1120" cy="60" r="150"/><circle cx="1120" cy="60" r="100"/><circle cx="1120" cy="60" r="50"/>
    <circle cx="120" cy="330" r="120"/><circle cx="120" cy="330" r="70"/>
  </g>

  <text x="72" y="148" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#fff" letter-spacing="-1">Interview<tspan fill="#67e8f9">Coach</tspan></text>
  <text x="74" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#e0e7ff">Mock interviews tailored to your resume and the job.</text>
  <text x="74" y="236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#c7d2fe">Skills-gap analysis · adaptive follow-ups · rubric scoring · progress tracking</text>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="74" y="266" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="140" y="288" text-anchor="middle" fill="#fff">100% local data</text>
    <rect x="218" y="266" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="293" y="288" text-anchor="middle" fill="#fff">offline mock mode</text>
    <rect x="380" y="266" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="465" y="288" text-anchor="middle" fill="#fff">by Aryaveer Mankotia</text>
  </g>

  <!-- score card -->
  <g filter="url(#soft)">
    <rect x="800" y="62" width="400" height="236" rx="20" fill="#0b1020" fill-opacity="0.88" stroke="#818cf8" stroke-opacity="0.5"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#e2e8f0">
    <text x="830" y="102" font-size="16" fill="#a5b4fc" font-weight="700" letter-spacing="2">ANSWER SCORE</text>
    <text x="1170" y="104" font-size="34" font-weight="800" text-anchor="end" fill="#fff">4.6<tspan font-size="18" fill="#94a3b8"> / 5</tspan></text>
    <g font-size="15">
      <text x="830" y="140">correctness</text><rect x="940" y="128" width="230" height="10" rx="5" fill="#1e293b"/><rect x="940" y="128" width="230" height="10" rx="5" fill="url(#bar)"/>
      <text x="830" y="170">depth</text><rect x="940" y="158" width="230" height="10" rx="5" fill="#1e293b"/><rect x="940" y="158" width="184" height="10" rx="5" fill="url(#bar)"/>
      <text x="830" y="200">clarity</text><rect x="940" y="188" width="230" height="10" rx="5" fill="#1e293b"/><rect x="940" y="188" width="230" height="10" rx="5" fill="url(#bar)"/>
      <text x="830" y="230">structure</text><rect x="940" y="218" width="230" height="10" rx="5" fill="#1e293b"/><rect x="940" y="218" width="184" height="10" rx="5" fill="url(#bar)"/>
      <text x="830" y="260">relevance</text><rect x="940" y="248" width="230" height="10" rx="5" fill="#1e293b"/><rect x="940" y="248" width="230" height="10" rx="5" fill="url(#bar)"/>
    </g>
  </g>
</svg>
