name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Tests (offline, mock LLM)
        run: pytest --cov=interviewcoach --cov-report=term-missing
        env:
          LLM_PROVIDER: mock
      - name: Scorer evaluation + demo smoke test
        run: |
          interviewcoach eval --out /tmp/eval.md
          interviewcoach demo --sessions first third --db /tmp/demo.db
        env:
          LLM_PROVIDER: mock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t interviewcoach .
      - name: Container starts and answers the health check
        run: |
          docker run -d --name ic -p 8501:8501 interviewcoach
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs ic
          exit 1
